name: anthropic_sdk_dart
description: >-
  A type-safe Dart/Flutter SDK for the Anthropic Messages API (Claude).
  Supports multi-tools with object type schemas, streaming via SSE,
  extended thinking, and structured error handling with retry policy.
version: 0.1.0
homepage: https://github.com/anthropic-sdk-dart
repository: https://github.com/anthropic-sdk-dart
issue_tracker: https://github.com/anthropic-sdk-dart/issues

environment:
  sdk: ^3.0.0

dependencies:
  http: ^1.2.0
  meta: ^1.12.0

dev_dependencies:
  build_runner: ^2.4.0
  kiri_check: ^1.3.1
  lints: ^5.1.1
  mockito: ^5.4.0
  test: ^1.25.0
